<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
  var segments = window.location.pathname.split('/').filter(Boolean);
  var slug = segments.pop();
  var base = '/' + segments.join('/') + '/';
  if (slug) {
    window.location.replace(base + '?p=' + encodeURIComponent(slug));
  } else {
    window.location.replace(base);
  }
</script>
</head>
<body></body>
</html>
